defaults:
  - model: model
  - datamodule: datamodule
  - callbacks: callbacks
  - _self_
  
seed: 0

trainer:
  _target_: pytorch_lightning.Trainer
  gradient_clip_val: 200
  max_epochs: 350
  min_epochs: 100
  log_every_n_steps: 5
  
callbacks:
  model_checkpoints:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: null 
    save_top_k: -1
    every_n_epochs: 10
    dirpath: lightning_checkpoints
    save_last: True
    verbose: False
    auto_insert_metric_name: False

  best_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: valid/loss
    mode: min
    save_top_k: 1
    dirpath: lightning_checkpoints
    filename: "best" 
    save_last: False
    verbose: False
    auto_insert_metric_name: False
    
  learning_rate_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: epoch
    
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: valid/loss
    mode: min
    patience: 50
    min_delta: 0
    check_finite: True

logger:
  tensorboard_logger:
    _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: "."
    version: ""
    name: ""